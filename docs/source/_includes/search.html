<dialog class="search-dialog" aria-labelledby="search-title">
  <div class="search-head"><h2 id="search-title">搜索文档</h2><button class="search-close icon-button" aria-label="关闭搜索">×</button></div>
  <label class="sr-only" for="search-input">搜索关键词</label>
  <input id="search-input" type="search" autocomplete="off" placeholder="输入名称、接口或关键词" aria-controls="search-results">
  <p class="search-status" role="status">输入关键词搜索正文和计算组件说明。</p>
  <ol id="search-results" class="search-results"></ol>
  <button class="search-more" hidden>显示更多结果</button>
</dialog>
