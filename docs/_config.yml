title: SiFli EPD Platform
description: 平台开发文档
documentation_version: v0.5
repository: https://github.com/OpenSiFli/SiFli-EPD-Platform
repository_branch: main
source: source
destination: _site
plugins_dir: _plugins
url: ""
baseurl: ""
encoding: utf-8
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: false
  hard_wrap: false
  parse_block_html: false
collections:
  docs:
    output: true
defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: document
      render_with_liquid: false
strict_front_matter: true
liquid:
  error_mode: strict
sass:
  style: compressed
exclude:
  - Gemfile
  - Gemfile.lock
